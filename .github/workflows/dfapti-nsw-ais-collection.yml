name: DFAPTI NSW AIS source monitor
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dfapti-nsw-ais-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate collector syntax and canonical registers
        run: |
          python -m py_compile scripts/dfapti_nsw_ais_monitor.py
          python -m json.tool cases/DFAPTI-NSW-AIS-2026-00001/data/source_register.json > /dev/null
          python -m json.tool cases/DFAPTI-NSW-AIS-2026-00001/data/automation_log.json > /dev/null
      - name: Capture source bytes and record SHA-256 provenance
        run: python scripts/dfapti_nsw_ais_monitor.py
      - name: Commit monitoring records atomically
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cases/DFAPTI-NSW-AIS-2026-00001/data/automation_log.json cases/DFAPTI-NSW-AIS-2026-00001/data/source_register.json cases/DFAPTI-NSW-AIS-2026-00001/source-archive/
          if ! git diff --cached --quiet; then
            git commit -m "DFAPTI NSW AIS: append source monitoring run"
            git push
          fi
