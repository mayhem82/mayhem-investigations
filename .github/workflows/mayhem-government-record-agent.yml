name: MAYHEM Government Record Agent

on:
  push:
    branches:
      - main
    paths:
      - "agent/**"
      - ".github/workflows/mayhem-government-record-agent.yml"
  workflow_dispatch:
    inputs:
      case_id:
        description: Existing MAYHEM CASE-ID
        required: true
      seed_url:
        description: Public government document/page URL
        required: true
      allowed_hosts:
        description: Comma-separated government hosts explicitly in scope
        required: true
      max_documents:
        description: Maximum documents this test run may preserve
        required: true
        default: "40"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify case already exists
        run: |
          node -e 'const r=require("./scripts/case-registry"); const id=process.env.CASE; const xs=(r.CASES||r.cases||r); if(!Array.isArray(xs)||!xs.some(x=>(x.id||x.case_id||x.case_identifier)===id)){console.error("Case is not registered: "+id);process.exit(2)}' || { echo "Case verification failed closed."; exit 2; }
        env:
          CASE: ${{ inputs.case_id || 'DFAPTI-BB-FF-2026-00001' }}
      - name: Install PDF parser
        run: python3 -m pip install --quiet pypdf
      - name: Collect public government records
        env:
          CASE_ID: ${{ inputs.case_id || 'DFAPTI-BB-FF-2026-00001' }}
          SEED_URL: ${{ inputs.seed_url || 'https://www.kempsey.nsw.gov.au/Your-Council/Council-news-public-notices/Council-news-updates/20250520-May-Council-meeting-wrap-story' }}
          ALLOWED_HOSTS: ${{ inputs.allowed_hosts || 'www.kempsey.nsw.gov.au,kempsey.nsw.gov.au' }}
          MAX_DOCUMENTS: ${{ inputs.max_documents || '20' }}
        run: |
          RESUME_ARGS=""
          if [ -f "public/agent-state/frontier.json" ]; then
            mkdir -p prior-agent-output
            cp public/agent-state/*.json prior-agent-output/ 2>/dev/null || true
            RESUME_ARGS="--resume prior-agent-output"
          fi
          python3 agent/government_record_agent.py --case "$CASE_ID" --seed "$SEED_URL" --hosts "$ALLOWED_HOSTS" --max-docs "$MAX_DOCUMENTS" --out agent-output $RESUME_ARGS
      - name: Publish candidate operational state
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_SHA: ${{ github.sha }}
        run: |
          mkdir -p public/agent-state
          cp agent-output/run.json agent-output/documents.json agent-output/leads.json agent-output/frontier.json public/agent-state/
          python3 - <<'PY'
          import json, os
          p="public/agent-state/run.json"
          d=json.load(open(p))
          d["workflow_run_id"]=os.environ["RUN_ID"]
          d["workflow_commit"]=os.environ["RUN_SHA"]
          d["workflow_state"]="COMPLETED"
          json.dump(d,open(p,"w"),indent=2)
          PY
          git config user.name "MAYHEM Government Record Agent"
          git config user.email "actions@users.noreply.github.com"
          git add public/agent-state
          if git diff --cached --quiet; then
            echo "No candidate state change to publish."
          else
            git commit -m "Publish MAYHEM agent candidate state [agent-state]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload candidate collection
        uses: actions/upload-artifact@v4
        with:
          name: mayhem-government-record-agent-${{ inputs.case_id || 'DFAPTI-BB-FF-2026-00001' }}-${{ github.run_id }}
          path: agent-output/
          if-no-files-found: error
          retention-days: 90
